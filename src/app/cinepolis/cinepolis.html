<main class="mx-auto max-w-6xl">
    <h1 class="text-3xl font-bold mb-6">
        Cinépolis
    </h1>

    <div class="bg-blue-700 p-6 rounded-lg shadow">
        <h2 class="text-2xl text-white font-bold mb-6">
            Entradas
        </h2>
        <!-- Nombre -->
        <div class="mb-5">
            <label for="nombre" class="block mb-2 text-m font-medium text-white">
                Nombre
            </label>
            <input type="text" id="nombre" name="nombre" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <!-- Cantidad Compradores -->
        <div class="mb-5">
            <label for="nCompradores" class="block mb-2 text-m font-medium text-white">
                Cantidad Compradores
            </label>
            <input type="text" id="nCompradores" name="nCompradores" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <!-- Tarjeta Cineco -->
        <div class="mb-5">
            <label for="tCineco" class="block mb-2 text-m font-medium text-white">
                Tarjeta Cineco
            </label>
            <input type="text" id="tCineco" name="tCineco" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <!-- Cantidad de Boletas -->
        <div class="mb-5">
            <label for="nBoletas" class="block mb-2 text-m font-medium text-white">
                Nombre
            </label>
            <input type="text" id="nBoletas" name="nBoletas" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
    </div>
</main>
